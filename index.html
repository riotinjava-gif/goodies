<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Box of Goodies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Special+Elite&family=Figtree:wght@500;700&family=Oswald:wght@500&display=swap">
<style>
/* Layout: one phone-sized "desk". Cover screen with a shipping box, then a desk of 8 paper objects that open as cards. */
:root{
  --desk:#e6dcc7;
  --desk-2:#efe7d5;
  --ink:#7d2f2f;
  --ink-soft:#a45c55;
  --paper:#fbf7ee;
  --card-edge:#d9cdb3;
  --cardboard:#b98a5a;
  --f-display:"Cormorant Garamond",Georgia,serif;
  --f-type:"Special Elite","Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-type);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
.stage{max-width:430px;min-height:100%;margin:0 auto;position:relative;display:flex;flex-direction:column;padding-block:20px 24px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex;animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* cover */
.cover{align-items:center;justify-content:center;gap:28px;text-align:center}
.cover h1{font:italic 600 2.5rem/1 var(--f-display);margin:0;color:var(--ink)}
.boxbtn{display:block;width:min(86%,340px);transition:transform .25s}
.boxbtn:active{transform:scale(.97)}
.boxbtn:not(.opening){animation:shake 2.6s ease-in-out infinite}
@keyframes shake{0%,55%,100%{transform:none}60%{transform:translateX(-4px) rotate(-2deg)}65%{transform:translateX(4px) rotate(2deg)}70%{transform:translateX(-4px) rotate(-2deg)}75%{transform:translateX(4px) rotate(2deg)}80%{transform:translateX(-3px) rotate(-1.5deg)}85%{transform:translateX(3px) rotate(1.5deg)}90%{transform:translateX(-1px) rotate(-.5deg)}}
.boxbtn svg{width:100%;height:auto;display:block;filter:drop-shadow(0 14px 14px rgba(90,60,30,.25))}
.lid{transform-origin:50% 100%;transition:transform .7s cubic-bezier(.5,0,.3,1)}
.opening .lid{transform:perspective(500px) rotateX(-110deg)}
.tap{font-size:.85rem;letter-spacing:.08em;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.credit{max-width:260px;line-height:1.5;font-size:.7rem;color:var(--ink-soft);letter-spacing:.05em}

/* goodies desk */
.desk h2{font:italic 600 1.75rem/1.1 var(--f-display);text-align:center;margin:8px 0 18px;text-wrap:balance}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;flex:1;align-content:space-between}
.item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px;transition:transform .2s}
.item:nth-child(4n+2),.item:nth-child(4n+3){transform:translateY(14px)}
.item:nth-child(odd){transform:rotate(-2deg)}
.item:nth-child(even){transform:rotate(2deg)}
.item{position:relative}
.num{position:absolute;top:0;left:50%;margin-left:calc(min(17vw,65px) * -1);width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:.8rem;display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 2px 4px rgba(90,60,30,.35)}
.item svg{animation:sway 3.6s ease-in-out infinite;transform-origin:50% 60%}
.item:nth-child(2) svg{animation-delay:-.6s}
.item:nth-child(3) svg{animation-delay:-1.2s}
.item:nth-child(4) svg{animation-delay:-1.8s}
.item:nth-child(5) svg{animation-delay:-2.4s}
.item:nth-child(6) svg{animation-delay:-3s}
.item:nth-child(7) svg{animation-delay:-.3s}
@keyframes sway{0%,100%{transform:rotate(-2.2deg) translateY(0)}50%{transform:rotate(2.2deg) translateY(-3px)}}
.item:last-child:nth-child(odd){grid-column:1/-1}
.item[data-k="gift"] svg{width:auto;height:min(32vw,120px)}
.item[data-k="voice"] svg{width:auto;height:min(28vw,100px)}
.item:hover,.item:active{transform:scale(1.06) rotate(0)}
.item svg{width:min(34vw,130px);max-width:130px;height:auto;display:block;filter:drop-shadow(0 6px 5px rgba(90,60,30,.28))}
.tag{background:#f6ecd9;border:1px solid var(--card-edge);border-radius:999px;padding:2px 12px;font-size:.72rem;letter-spacing:.03em}
.foot{text-align:center;margin-top:28px;font-size:.72rem;color:var(--ink-soft);line-height:1.6}

/* modal */
.veil{position:fixed;inset:0;background:rgba(230,220,199,.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.veil.on{display:flex}
.card{position:relative;background:var(--paper);border:1px solid var(--card-edge);box-shadow:0 18px 40px rgba(90,60,30,.25);width:100%;max-width:400px;max-height:100%;overflow-y:auto;padding:28px 22px 24px;animation:pop .35s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.x{position:absolute;top:8px;right:10px;width:32px;height:32px;font-size:1.3rem;line-height:1;color:var(--ink)}
.card p{margin:0 0 12px;font-size:.88rem;line-height:1.7}
.card h3{font:italic 600 1.6rem/1.15 var(--f-display);margin:0 0 14px;text-wrap:balance}
.btn{display:inline-block;text-decoration:none;color:var(--ink);background:#f1dfd6;border:1px solid var(--ink-soft);padding:8px 18px;font-size:.8rem;border-radius:3px;letter-spacing:.04em}
.btn:active{transform:translateY(1px)}
.center{text-align:center}
.letter p{white-space:pre-line}
.sign{font:italic 600 1.5rem var(--f-display);margin-top:8px}

/* parts */
.tape{background:var(--ink);color:#f7e6dc;padding:16px;border-radius:6px}
.tape h3{color:#f7e6dc;margin-bottom:10px}
.tape ol{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:.82rem}
.tape li{display:flex;gap:10px;align-items:baseline;border-bottom:1px dashed rgba(247,230,220,.3);padding-bottom:8px}
.tape li b{font-weight:400;opacity:.65;min-width:1.6em}
.card.sp{background:linear-gradient(180deg,#c43b78 0%,#8d2b5a 38%,#3f1630 100%);border:0;color:#fff;border-radius:14px;padding:32px 24px 24px;font-family:"Figtree","Helvetica Neue",Arial,sans-serif}
.card.sp .x{color:#fff}
.spcover{display:block;width:78%;margin:0 auto 22px}
.spcover img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:6px;box-shadow:0 12px 28px rgba(0,0,0,.4)}
.sptitle{font:700 1.9rem/1.1 "Figtree","Helvetica Neue",Arial,sans-serif;font-style:normal;margin:0 0 8px;color:#fff;text-align:left}
.spdesc{font-size:.95rem;line-height:1.4;color:rgba(255,255,255,.75);margin:0 0 14px}
.spinfo{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;margin-bottom:4px}
.spinfo .splogo{width:20px;height:20px}
.spsub{font-weight:500;color:rgba(255,255,255,.7);margin-bottom:18px}
.spgo{display:flex;width:56px;height:56px;margin-left:auto;border-radius:50%;background:#1ed760;color:#111;text-decoration:none;align-items:center;justify-content:center}
.spgo svg{width:26px;height:26px;margin-left:3px}
.tape .spot{background:#f7e6dc;color:var(--ink);text-decoration:none;border-color:#f7e6dc}
.polaroid{background:#fff;padding:10px 10px 36px;box-shadow:0 4px 10px rgba(0,0,0,.15);transform:rotate(-1.5deg)}
.polaroid svg,.polaroid img{display:block;width:100%;height:auto}
.polaroid figcaption{font:italic 600 1.2rem var(--f-display);text-align:center;margin-top:10px}
.news-head{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.news-title{font:600 1.15rem/1.35 var(--f-type);margin:0 0 14px}
.paper{font-family:Georgia,"Times New Roman",serif}
.paper h3{font:700 1.35rem/1.25 Georgia,serif;font-style:normal;margin-bottom:6px}
.paper p{font-size:.92rem;line-height:1.75}
.meta{font-size:.72rem;color:var(--ink-soft);margin-bottom:14px;font-family:var(--f-type)}
.pill{display:inline-block;background:var(--ink);color:#fff;font-size:.65rem;padding:2px 8px;letter-spacing:.1em;margin-bottom:10px;font-family:var(--f-type)}
.ticket{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#f6e9c9;border:1.5px dashed var(--ink-soft);padding:12px 14px;margin-bottom:10px;position:relative;font-size:.82rem;line-height:1.4}
.ticket i{font:italic 600 1.7rem var(--f-display);font-style:italic;min-width:2.4rem}
.ticket.used{opacity:.6;text-decoration:line-through}
.ticket.used::after{content:"DIPAKAI";position:absolute;right:10px;top:50%;transform:translateY(-50%) rotate(-10deg);border:2px solid var(--ink);padding:1px 8px;font-size:.8rem;text-decoration:none;color:var(--ink);background:var(--paper)}
.player{display:flex;align-items:center;gap:12px;background:#f1dfd6;border:1px solid var(--ink-soft);padding:12px}
.play{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;flex:none;display:flex;align-items:center;justify-content:center}
.play svg{width:18px;height:18px}
.bar{flex:1;height:4px;background:rgba(125,47,47,.25);border-radius:2px;position:relative;overflow:hidden}
.bar span{position:absolute;inset:0 auto 0 0;width:0;background:var(--ink)}
.time{font-size:.7rem;min-width:5.4em;text-align:right}
.vcap{white-space:pre-line;margin:16px 0 0;font-size:.86rem;line-height:1.75}
.bouquet svg{width:100%;height:auto;display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</main>

article:function(){
  return '<div class="paper"><span class="pill">KABAR HATI</span><h3>Eden dan Asmara Dikabarkan Pacaran, Sudah Resmi Dua Bulan?</h3><div class="meta">Sabtu, 17 Oktober 2026 &middot; Redaksi Hati</div>'+
  '<p>Jakarta, tidak. Yogyakarta, bukan juga. Tapi kabar ini sudah terlalu manis untuk disimpan sendiri: Eden dan Asmara dikabarkan sudah resmi menjalin hubungan selama dua bulan, terhitung sejak 17 Agustus 2026.</p>'+
  '<p>Menurut sumber terdekat yang enggan disebutkan namanya (yaitu Eden sendiri), keduanya tampak semakin kompak. Tidak ada drama berarti, hanya banyak cerita, banyak tawa, dan sesekali berebut memilih tempat makan.</p>'+
  '<p>"Dua bulan itu rasanya sebentar, tapi aku tahu aku mau lanjut," ujar sang sumber saat dimintai konfirmasi. Ia juga menyebut Asmara sebagai orang yang paling sabar yang pernah ia kenal.</p>'+
  '<p>Hingga berita ini diturunkan, belum ada tanda-tanda keduanya akan berhenti. Redaksi hanya bisa menyimpulkan satu hal: kabar ini benar adanya, dan sepertinya akan berlanjut ke bulan ketiga.</p>'+
  '<p style="font-style:italic;color:var(--ink-soft);font-size:.82rem">Baca juga: Cara Mengatakan "Sayang" Tanpa Terdengar Kaku.</p></div>';
},
draw:function(){
  return '<div class="center"><img src="'+CONFIG.draw+'" alt="We are destined" style="width:100%;height:auto;display:block"><p style="margin:14px 0 0">Red string theory (ceker ayam version)</p></div>';
},
coupon:function(){
  return '<h3>Kupon buat kamu</h3>'+CONFIG.coupons.map(function(c,i){return '<button class="ticket" data-c="'+i+'"><i>'+c[0]+'</i><span>'+c[1]+'</span></button>';}).join("")+'<p style="font-size:.74rem;color:var(--ink-soft);margin:6px 0 0">Tap kupon untuk dipakai.</p>';
},
note:function(){
  var paras=CONFIG.note.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  return '<div class="letter"><p>'+paras+'</p></div>';
},
voice:function(){
  return '<h3>Voice from the heart</h3><div class="player"><button class="play" id="play" aria-label="Putar">'+PLAY+'</button><div class="bar"><span id="prog"></span></div><div class="time" id="time">0:00</div></div><p class="vcap">'+CONFIG.voiceCaption+'</p>';
},
gift:function(){
  return '<div class="center"><p style="margin:6px 0 0">I have another gift for you, Baby. But it can only be redeemed by sending me your home address. Tolong, ya, Sayang?</p></div>';
}
};

var speaking=null,timer=null;
function stopVoice(){if(audio){audio.pause();audio=null}}
function open(k){
  stopVoice();
  var cls=(k==="article"||k==="note")?"":"";
  card.className="card"+(k==="song"?" sp":"");
  card.innerHTML='<button class="x" aria-label="Tutup">&times;</button>'+views[k]();
  card.scrollTop=0;
  veil.classList.add("on");
  card.querySelector(".x").onclick=close;
  if(k==="coupon")card.querySelectorAll(".ticket").forEach(function(t){t.onclick=function(){t.classList.toggle("used")}});
  if(k==="voice")setupVoice();
}
function close(){stopVoice();veil.classList.remove("on");}
veil.addEventListener("click",function(e){if(e.target===veil)close()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});
$("#grid").addEventListener("click",function(e){var b=e.target.closest(".item");if(b)open(b.dataset.k)});

var audio=null;
function setupVoice(){
  var btn=$("#play"),prog=$("#prog"),time=$("#time");
  function fmt(s){s=Math.floor(s||0);return Math.floor(s/60)+":"+(s%60<10?"0":"")+(s%60)}
  audio=new Audio(CONFIG.voice);audio.preload="metadata";
  function show(){var t=audio.duration||0;prog.style.width=t?(audio.currentTime/t*100)+"%":"0";time.textContent=fmt(audio.currentTime)+" / "+fmt(t)}
  audio.addEventListener("loadedmetadata",show);
  audio.addEventListener("timeupdate",show);
  audio.addEventListener("ended",function(){btn.innerHTML=PLAY;audio.currentTime=0;show()});
  time.textContent="0:00 / 0:45";
  btn.onclick=function(){
    if(audio.paused){audio.play().then(function(){btn.innerHTML=PAUSE}).catch(function(){})}
    else{audio.pause();btn.innerHTML=PLAY}
  };
}

/* cover -> desk */
$("#openBox").onclick=function(){
  $("#openBox").classList.add("opening");
  setTimeout(function(){
    $("#cover").classList.remove("on");$("#desk").classList.add("on");window.scrollTo(0,0);
  },750);
};
